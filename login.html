<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrar | Oficina Mecânica</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🔧</text></svg>">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-sm">

    <div class="text-center mb-6">
      <span class="text-4xl">🔧</span>
      <h1 class="text-white text-xl font-bold mt-2">Oficina Mecânica</h1>
      <p class="text-slate-400 text-sm">Acesso restrito. Fale com o administrador para receber seu login.</p>
    </div>

    <div class="bg-white rounded-xl shadow-lg p-6 space-y-5">

      <p id="msg-bloqueio" class="hidden text-sm text-center bg-red-50 text-red-700 border border-red-200 rounded-lg px-3 py-2">
        Seu acesso foi desativado pelo administrador. Entre em contato para reativar.
      </p>

      <form id="form-auth" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">E-mail</label>
          <input type="email" id="input-email" required autocomplete="email"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none"
            placeholder="voce@oficina.com" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Senha</label>
          <input type="password" id="input-senha" required minlength="6" autocomplete="current-password"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none"
            placeholder="Sua senha" />
        </div>

        <button type="submit" id="btn-submit"
          class="w-full bg-sky-600 hover:bg-sky-700 disabled:bg-sky-300 text-white font-semibold py-2.5 rounded-lg transition">
          Entrar
        </button>
      </form>

      <p id="msg-auth" class="text-sm text-center hidden"></p>
    </div>

    <p class="text-center text-slate-500 text-xs mt-6">Sistema para gestão de oficinas mecânicas.</p>
  </div>

  <script type="module">
    import { supabase, logSupabaseError, registrarUltimoLogin } from './js/supabase.js';

    const form = document.getElementById('form-auth');
    const btnSubmit = document.getElementById('btn-submit');
    const msgEl = document.getElementById('msg-auth');
    const msgBloqueioEl = document.getElementById('msg-bloqueio');
    const inputEmail = document.getElementById('input-email');
    const inputSenha = document.getElementById('input-senha');

    // -----------------------------------------------------------------
    // Se veio de um redirecionamento por bloqueio de acesso, avisa.
    // -----------------------------------------------------------------
    const params = new URLSearchParams(window.location.search);
    if (params.get('bloqueado') === '1') {
      msgBloqueioEl.classList.remove('hidden');
    }

    // -----------------------------------------------------------------
    // Se já existe uma sessão ativa (e válida), pula direto para o painel.
    // A própria página index.html/etc. valida se o acesso ainda está ativo.
    // -----------------------------------------------------------------
    (async function verificarSessao() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) window.location.href = 'index.html';
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Entrando...';
      msgEl.classList.add('hidden');

      const email = inputEmail.value.trim();
      const senha = inputSenha.value;

      const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });

      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Entrar';

      if (error) {
        logSupabaseError('login', error);
        msgEl.textContent = 'E-mail ou senha incorretos.';
        msgEl.className = 'text-sm text-center text-red-600';
        return;
      }

      if (data.user) {
        await registrarUltimoLogin(data.user.id);
      }

      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
