<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minha Conta | Oficina Mecânica</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🔧</text></svg>">
</head>
<body class="bg-gray-100 min-h-screen pb-20 md:pb-0">

  <!-- NAV DESKTOP -->
  <header class="hidden md:flex items-center justify-between bg-slate-900 text-white px-8 py-4 shadow-lg sticky top-0 z-40">
    <div class="flex items-center gap-2 font-bold text-lg">
      <span class="text-2xl">🔧</span>
      <span class="nome-oficina-exibido">Oficina Mecânica</span>
    </div>
    <nav class="flex items-center gap-2">
      <a href="index.html" class="px-4 py-2 rounded-lg hover:bg-slate-700 font-medium transition">Painel</a>
      <a href="clientes.html" class="px-4 py-2 rounded-lg hover:bg-slate-700 font-medium transition">Clientes</a>
      <a href="servicos.html" class="px-4 py-2 rounded-lg hover:bg-slate-700 font-medium transition">Serviços</a>
      <a href="concluidos.html" class="px-4 py-2 rounded-lg hover:bg-slate-700 font-medium transition">Concluídos</a>
      <a href="admin.html" id="nav-admin" class="hidden px-4 py-2 rounded-lg hover:bg-amber-700 bg-amber-600 font-medium transition">⚙️ Admin</a>
      <a href="conta.html" class="px-4 py-2 rounded-lg bg-sky-600 font-medium transition">🔑 Minha Conta</a>
      <span class="text-xs text-slate-400 pl-3 pr-1 hidden lg:inline" id="usuario-logado"></span>
      <button id="btn-sair" class="px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 font-medium transition text-sm" title="Sair">Sair</button>
    </nav>
  </header>

  <!-- CABEÇALHO MOBILE -->
  <header class="md:hidden flex items-center gap-2 bg-slate-900 text-white px-5 py-4 shadow-lg sticky top-0 z-40">
    <span class="text-2xl">🔧</span>
    <span class="font-bold text-lg nome-oficina-exibido">Oficina Mecânica</span>
  </header>

  <main class="max-w-md mx-auto px-4 md:px-8 py-6 space-y-6">

    <div>
      <h1 class="text-2xl font-bold text-zinc-800">🔑 Minha Conta</h1>
      <p class="text-gray-500 text-sm">Logado como <strong id="email-atual"></strong></p>
    </div>

    <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 md:p-6">
      <h2 class="text-lg font-semibold text-zinc-800 mb-4">Nome da Oficina</h2>
      <p class="text-sm text-gray-500 mb-3">Esse nome aparece no topo do sistema no lugar de "Oficina Mecânica", só para você.</p>
      <form id="form-nome-oficina" class="flex flex-col md:flex-row gap-3">
        <input type="text" id="input-nome-oficina" placeholder="Ex: Oficina do Manoel"
          class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none" />
        <button type="submit" id="btn-salvar-nome-oficina"
          class="bg-sky-600 hover:bg-sky-700 disabled:bg-sky-300 text-white font-semibold px-6 py-2.5 rounded-lg transition w-full md:w-auto">
          Salvar
        </button>
      </form>
      <p id="msg-nome-oficina" class="text-sm mt-3 hidden"></p>
    </section>

    <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 md:p-6">
      <h2 class="text-lg font-semibold text-zinc-800 mb-4">Trocar senha</h2>
      <form id="form-trocar-senha" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Nova senha</label>
          <input type="password" id="input-nova-senha" required minlength="6" autocomplete="new-password"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none"
            placeholder="Mínimo 6 caracteres" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Confirme a nova senha</label>
          <input type="password" id="input-confirmar-senha" required minlength="6" autocomplete="new-password"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none"
            placeholder="Repita a senha" />
        </div>
        <button type="submit" id="btn-salvar"
          class="w-full bg-sky-600 hover:bg-sky-700 disabled:bg-sky-300 text-white font-semibold py-2.5 rounded-lg transition">
          Salvar nova senha
        </button>
      </form>
      <p id="msg-resultado" class="text-sm mt-3 hidden"></p>
    </section>

  </main>

  <!-- NAV MOBILE -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 text-white flex justify-around items-center py-2 shadow-2xl z-40 overflow-x-auto">
    <a href="index.html" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg shrink-0">
      <span class="text-xl">📋</span>
      <span class="text-xs font-medium">Painel</span>
    </a>
    <a href="clientes.html" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg shrink-0">
      <span class="text-xl">👤</span>
      <span class="text-xs font-medium">Clientes</span>
    </a>
    <a href="servicos.html" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg shrink-0">
      <span class="text-xl">🛠️</span>
      <span class="text-xs font-medium">Serviços</span>
    </a>
    <a href="concluidos.html" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg shrink-0">
      <span class="text-xl">✅</span>
      <span class="text-xs font-medium">Concluídos</span>
    </a>
    <a href="conta.html" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg bg-slate-700 shrink-0">
      <span class="text-xl">🔑</span>
      <span class="text-xs font-medium">Conta</span>
    </a>
  </nav>

  <script type="module">
    import { supabase, logSupabaseError, requireAuth, configurarBarraUsuario } from './js/supabase.js';

    const form = document.getElementById('form-trocar-senha');
    const btnSalvar = document.getElementById('btn-salvar');
    const msgEl = document.getElementById('msg-resultado');
    const inputNovaSenha = document.getElementById('input-nova-senha');
    const inputConfirmarSenha = document.getElementById('input-confirmar-senha');
    const emailAtualEl = document.getElementById('email-atual');

    const formNomeOficina = document.getElementById('form-nome-oficina');
    const inputNomeOficina = document.getElementById('input-nome-oficina');
    const btnSalvarNomeOficina = document.getElementById('btn-salvar-nome-oficina');
    const msgNomeOficina = document.getElementById('msg-nome-oficina');

    formNomeOficina.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSalvarNomeOficina.disabled = true;
      btnSalvarNomeOficina.textContent = 'Salvando...';
      msgNomeOficina.classList.add('hidden');

      const { data: { user } } = await supabase.auth.getUser();
      const nomeOficina = inputNomeOficina.value.trim() || null;

      const { error } = await supabase.from('perfis').update({ nome_oficina: nomeOficina }).eq('user_id', user.id);

      btnSalvarNomeOficina.disabled = false;
      btnSalvarNomeOficina.textContent = 'Salvar';

      if (error) {
        logSupabaseError('salvarNomeOficina', error);
        msgNomeOficina.textContent = 'Erro ao salvar o nome da oficina.';
        msgNomeOficina.className = 'text-sm mt-3 text-red-600';
      } else {
        msgNomeOficina.textContent = 'Nome atualizado! O topo do sistema já foi atualizado.';
        msgNomeOficina.className = 'text-sm mt-3 text-green-600';
        document.querySelectorAll('.nome-oficina-exibido').forEach(el => {
          el.textContent = nomeOficina || 'Oficina Mecânica';
        });
      }
      msgNomeOficina.classList.remove('hidden');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEl.classList.add('hidden');

      if (inputNovaSenha.value !== inputConfirmarSenha.value) {
        msgEl.textContent = 'As senhas não coincidem.';
        msgEl.className = 'text-sm mt-3 text-red-600';
        msgEl.classList.remove('hidden');
        return;
      }

      btnSalvar.disabled = true;
      btnSalvar.textContent = 'Salvando...';

      const { error } = await supabase.auth.updateUser({ password: inputNovaSenha.value });

      btnSalvar.disabled = false;
      btnSalvar.textContent = 'Salvar nova senha';

      if (error) {
        logSupabaseError('trocarSenha', error);
        msgEl.textContent = 'Erro ao trocar a senha. Tente novamente.';
        msgEl.className = 'text-sm mt-3 text-red-600';
      } else {
        msgEl.textContent = 'Senha alterada com sucesso!';
        msgEl.className = 'text-sm mt-3 text-green-600';
        form.reset();
      }
      msgEl.classList.remove('hidden');
    });

    (async function init() {
      const user = await requireAuth();
      if (!user) return; // redirecionado para login.html

      configurarBarraUsuario(user);
      emailAtualEl.textContent = user.email;
      inputNomeOficina.value = user.nomeOficina ?? '';
    })();
  </script>

</body>
</html>
