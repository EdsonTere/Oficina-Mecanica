<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Concluídos | Oficina Mecânica</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🔧</text></svg>">
</head>
<body class="bg-gray-100 min-h-screen pb-20 md:pb-0">

  <!-- NAV DESKTOP -->
  <header class="hidden md:flex items-center justify-between bg-slate-900 text-white px-8 py-4 shadow-lg sticky top-0 z-40">
    <div class="flex items-center gap-2 font-bold text-lg">
      <span class="text-2xl">🔧</span>
      <span>Oficina Mecânica</span>
    </div>
    <nav class="flex items-center gap-2">
      <a href="index.html" class="px-4 py-2 rounded-lg hover:bg-slate-700 font-medium transition">Painel</a>
      <a href="clientes.html" class="px-4 py-2 rounded-lg hover:bg-slate-700 font-medium transition">Clientes</a>
      <a href="servicos.html" class="px-4 py-2 rounded-lg hover:bg-slate-700 font-medium transition">Serviços</a>
      <a href="concluidos.html" class="px-4 py-2 rounded-lg bg-sky-600 font-medium transition">Concluídos</a>
      <span class="text-xs text-slate-400 pl-3 pr-1 hidden lg:inline" id="usuario-logado"></span>
      <button id="btn-sair" class="px-3 py-2 rounded-lg hover:bg-slate-700 text-slate-300 font-medium transition text-sm" title="Sair">Sair</button>
    </nav>
  </header>

  <!-- CABEÇALHO MOBILE -->
  <header class="md:hidden flex items-center gap-2 bg-slate-900 text-white px-5 py-4 shadow-lg sticky top-0 z-40">
    <span class="text-2xl">🔧</span>
    <span class="font-bold text-lg">Oficina Mecânica</span>
  </header>

  <main class="max-w-6xl mx-auto px-4 md:px-8 py-6 space-y-6">

    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold text-zinc-800">Serviços Concluídos</h1>
        <p class="text-gray-500 text-sm">Histórico de agendamentos finalizados.</p>
      </div>
      <button id="btn-atualizar-lista" class="text-sm text-sky-600 hover:underline shrink-0">🔄 Atualizar</button>
    </div>

    <input type="text" id="input-busca" placeholder="🔎 Buscar por nome do cliente ou placa..."
      class="w-full md:w-96 border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none" />

    <div id="lista-concluidos" class="space-y-3">
      <p class="text-gray-400 text-sm">Carregando...</p>
    </div>

  </main>

  <!-- NAV MOBILE -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 text-white flex justify-around items-center py-2 shadow-2xl z-40">
    <a href="index.html" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg">
      <span class="text-xl">📋</span>
      <span class="text-xs font-medium">Painel</span>
    </a>
    <a href="clientes.html" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg">
      <span class="text-xl">👤</span>
      <span class="text-xs font-medium">Clientes</span>
    </a>
    <a href="servicos.html" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg">
      <span class="text-xl">🛠️</span>
      <span class="text-xs font-medium">Serviços</span>
    </a>
    <a href="concluidos.html" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg bg-slate-700">
      <span class="text-xl">✅</span>
      <span class="text-xs font-medium">Concluídos</span>
    </a>
  </nav>

  <script type="module">
    import { supabase, logSupabaseError, formatarMoeda, formatarDataHora, calcularTotalItens, gerarLinkWhatsApp, montarMensagemAgendamento, requireAuth, configurarBarraUsuario } from './js/supabase.js';

    const listaEl = document.getElementById('lista-concluidos');
    const inputBusca = document.getElementById('input-busca');
    let concluidosCache = [];

    // -----------------------------------------------------------------
    // Carrega agendamentos com status "Concluído"
    // -----------------------------------------------------------------
    async function carregarConcluidos() {
      listaEl.innerHTML = '<p class="text-gray-400 text-sm">Carregando...</p>';

      const { data, error } = await supabase
        .from('agendamentos')
        .select(`
          id, data_hora, status, observacoes,
          clientes ( nome, telefone ),
          veiculos ( marca, modelo, placa ),
          agendamento_servicos ( quantidade, preco_unitario, servicos ( descricao ) )
        `)
        .eq('status', 'Concluído')
        .order('data_hora', { ascending: false });

      if (error) {
        logSupabaseError('carregarConcluidos', error);
        listaEl.innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar serviços concluídos.</p>';
        return;
      }

      concluidosCache = data;
      renderLista(data);
    }

    function renderLista(lista) {
      if (!lista.length) {
        listaEl.innerHTML = '<p class="text-gray-400 text-sm">Nenhum serviço concluído ainda.</p>';
        return;
      }

      listaEl.innerHTML = lista.map(renderCard).join('');

      document.querySelectorAll('.btn-reabrir').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Reabrir este agendamento? Ele voltará para o Painel como "Em Andamento".')) return;
          const { error } = await supabase.from('agendamentos').update({ status: 'Em Andamento' }).eq('id', btn.dataset.id);
          if (error) {
            logSupabaseError('reabrirAgendamento', error);
            alert('Erro ao reabrir agendamento.');
          } else {
            await carregarConcluidos();
          }
        });
      });
    }

    function renderCard(ag) {
      const itensBadges = (ag.agendamento_servicos || []).map(item =>
        `<span class="text-xs bg-slate-100 text-slate-700 border border-slate-300 px-2 py-1 rounded-full">
          🛠️ ${escapeHtml(item.servicos?.descricao ?? 'Serviço')} x${item.quantidade}
        </span>`
      ).join('');

      const total = calcularTotalItens(ag.agendamento_servicos || []);
      const linkWhatsApp = gerarLinkWhatsApp(ag.clientes?.telefone, montarMensagemAgendamento(ag));

      return `
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 space-y-3">
          <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-3">
            <div class="space-y-1">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-semibold text-zinc-800">${escapeHtml(ag.clientes?.nome ?? 'Cliente removido')}</span>
                <span class="text-xs px-2 py-0.5 rounded-full border font-medium bg-green-100 text-green-800 border-green-300">Concluído</span>
              </div>
              <p class="text-sm text-gray-500">
                🚗 ${ag.veiculos ? `${ag.veiculos.marca} ${ag.veiculos.modelo} - ${ag.veiculos.placa}` : 'Veículo removido'}
              </p>
              <p class="text-sm text-gray-500">🗓️ ${formatarDataHora(ag.data_hora)}</p>
              <div class="flex flex-wrap gap-1.5 pt-1">${itensBadges}</div>
              <p class="text-sm font-semibold text-zinc-800 pt-1">Total: <span class="text-sky-600">${formatarMoeda(total)}</span></p>
            </div>
            <div class="shrink-0 space-y-2 w-full md:w-auto">
              <div class="flex gap-2">
                <a href="orcamento.html?id=${ag.id}" target="_blank"
                  class="flex-1 text-center text-xs bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg font-medium transition">
                  🧾 Recibo
                </a>
                ${linkWhatsApp
                  ? `<a href="${linkWhatsApp}" target="_blank" class="flex-1 text-center text-xs bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg font-medium transition">📲 WhatsApp</a>`
                  : `<span class="flex-1 text-center text-xs bg-gray-200 text-gray-400 px-3 py-2 rounded-lg font-medium" title="Cliente sem telefone cadastrado">📲 WhatsApp</span>`
                }
              </div>
              <button data-id="${ag.id}" class="btn-reabrir w-full text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 px-3 py-2 rounded-lg font-medium transition">
                ↩️ Reabrir
              </button>
            </div>
          </div>
        </div>
      `;
    }

    inputBusca.addEventListener('input', () => {
      const termo = inputBusca.value.trim().toLowerCase();
      if (!termo) {
        renderLista(concluidosCache);
        return;
      }
      const filtrados = concluidosCache.filter(ag =>
        (ag.clientes?.nome ?? '').toLowerCase().includes(termo) ||
        (ag.veiculos?.placa ?? '').toLowerCase().includes(termo)
      );
      renderLista(filtrados);
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    document.getElementById('btn-atualizar-lista').addEventListener('click', carregarConcluidos);

    (async function init() {
      const user = await requireAuth();
      if (!user) return; // redirecionado para login.html

      configurarBarraUsuario(user);
      await carregarConcluidos();
    })();
  </script>

</body>
</html>
