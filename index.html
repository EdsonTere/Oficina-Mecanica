<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel | Oficina Mecânica</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>🔧</text></svg>">
</head>
<body class="bg-gray-100 min-h-screen pb-20 md:pb-0">

  <!-- ============================================================ -->
  <!-- NAV DESKTOP (topo) -->
  <!-- ============================================================ -->
  <header class="hidden md:flex items-center justify-between bg-slate-900 text-white px-8 py-4 shadow-lg sticky top-0 z-40">
    <div class="flex items-center gap-2 font-bold text-lg">
      <span class="text-2xl">🔧</span>
      <span>Oficina Mecânica</span>
    </div>
    <nav class="flex gap-2">
      <a href="index.html" class="px-4 py-2 rounded-lg bg-sky-600 font-medium transition">Painel</a>
      <a href="clientes.html" class="px-4 py-2 rounded-lg hover:bg-slate-700 font-medium transition">Clientes</a>
      <a href="servicos.html" class="px-4 py-2 rounded-lg hover:bg-slate-700 font-medium transition">Serviços</a>
    </nav>
  </header>

  <!-- ============================================================ -->
  <!-- CABEÇALHO MOBILE -->
  <!-- ============================================================ -->
  <header class="md:hidden flex items-center gap-2 bg-slate-900 text-white px-5 py-4 shadow-lg sticky top-0 z-40">
    <span class="text-2xl">🔧</span>
    <span class="font-bold text-lg">Oficina Mecânica</span>
  </header>

  <!-- ============================================================ -->
  <!-- CONTEÚDO PRINCIPAL -->
  <!-- ============================================================ -->
  <main class="max-w-6xl mx-auto px-4 md:px-8 py-6 space-y-8">

    <div>
      <h1 class="text-2xl font-bold text-zinc-800">Painel de Agendamentos</h1>
      <p class="text-gray-500 text-sm">Cadastre novos agendamentos e acompanhe o status dos serviços.</p>
    </div>

    <!-- FORM NOVO AGENDAMENTO -->
    <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 md:p-6">
      <h2 class="text-lg font-semibold text-zinc-800 mb-4">Novo Agendamento</h2>
      <form id="form-agendamento" class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Cliente</label>
          <select id="select-cliente" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none">
            <option value="">Selecione um cliente...</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Veículo</label>
          <select id="select-veiculo" required disabled
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none disabled:bg-gray-100">
            <option value="">Selecione o cliente primeiro...</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Serviço</label>
          <select id="select-servico" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none">
            <option value="">Selecione um serviço...</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">
            Preço <span id="preco-servico" class="text-sky-600 font-semibold"></span>
          </label>
          <input type="datetime-local" id="input-data-hora" required
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none" />
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-600 mb-1">Observações (opcional)</label>
          <textarea id="input-observacoes" rows="2"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none"
            placeholder="Detalhes adicionais sobre o serviço..."></textarea>
        </div>

        <div class="md:col-span-2 flex justify-end">
          <button type="submit" id="btn-salvar-agendamento"
            class="bg-sky-600 hover:bg-sky-700 disabled:bg-sky-300 text-white font-semibold px-6 py-2.5 rounded-lg transition w-full md:w-auto">
            Agendar
          </button>
        </div>

      </form>
      <p id="msg-agendamento" class="text-sm mt-3 hidden"></p>
    </section>

    <!-- LISTA DE AGENDAMENTOS -->
    <section class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-zinc-800">Agendamentos</h2>
        <button id="btn-atualizar-lista" class="text-sm text-sky-600 hover:underline">🔄 Atualizar</button>
      </div>

      <div id="lista-agendamentos" class="space-y-3">
        <p class="text-gray-400 text-sm">Carregando agendamentos...</p>
      </div>
    </section>

  </main>

  <!-- ============================================================ -->
  <!-- NAV MOBILE (inferior) -->
  <!-- ============================================================ -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 text-white flex justify-around items-center py-2 shadow-2xl z-40">
    <a href="index.html" class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-lg bg-slate-700">
      <span class="text-xl">📋</span>
      <span class="text-xs font-medium">Painel</span>
    </a>
    <a href="clientes.html" class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-lg">
      <span class="text-xl">👤</span>
      <span class="text-xs font-medium">Clientes</span>
    </a>
    <a href="servicos.html" class="flex flex-col items-center gap-0.5 px-4 py-1.5 rounded-lg">
      <span class="text-xl">🛠️</span>
      <span class="text-xs font-medium">Serviços</span>
    </a>
  </nav>

  <!-- ============================================================ -->
  <!-- SCRIPT PRINCIPAL -->
  <!-- ============================================================ -->
  <script type="module">
    import { supabase, logSupabaseError, formatarMoeda, formatarDataHora } from './js/supabase.js';

    // Cache local de dados carregados
    let clientesCache = [];
    let veiculosCache = [];
    let servicosCache = [];

    const selectCliente = document.getElementById('select-cliente');
    const selectVeiculo = document.getElementById('select-veiculo');
    const selectServico = document.getElementById('select-servico');
    const precoServicoEl = document.getElementById('preco-servico');
    const form = document.getElementById('form-agendamento');
    const btnSalvar = document.getElementById('btn-salvar-agendamento');
    const msgEl = document.getElementById('msg-agendamento');
    const listaEl = document.getElementById('lista-agendamentos');

    // Mapas de cor/estilo por status
    const STATUS_STYLE = {
      'Pendente': 'bg-yellow-100 text-yellow-800 border-yellow-300',
      'Em Andamento': 'bg-blue-100 text-blue-800 border-blue-300',
      'Concluído': 'bg-green-100 text-green-800 border-green-300',
      'Cancelado': 'bg-red-100 text-red-800 border-red-300',
    };
    const STATUS_OPCOES = ['Pendente', 'Em Andamento', 'Concluído', 'Cancelado'];

    // -----------------------------------------------------------------
    // Carrega clientes para o select
    // -----------------------------------------------------------------
    async function carregarClientes() {
      const { data, error } = await supabase.from('clientes').select('id, nome').order('nome');
      if (error) return logSupabaseError('carregarClientes', error);
      clientesCache = data;
      selectCliente.innerHTML = '<option value="">Selecione um cliente...</option>' +
        data.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
    }

    // -----------------------------------------------------------------
    // Carrega serviços para o select
    // -----------------------------------------------------------------
    async function carregarServicos() {
      const { data, error } = await supabase.from('servicos').select('id, descricao, preco').order('descricao');
      if (error) return logSupabaseError('carregarServicos', error);
      servicosCache = data;
      selectServico.innerHTML = '<option value="">Selecione um serviço...</option>' +
        data.map(s => `<option value="${s.id}" data-preco="${s.preco}">${s.descricao}</option>`).join('');
    }

    // -----------------------------------------------------------------
    // Ao trocar cliente -> filtra veículos daquele cliente
    // -----------------------------------------------------------------
    selectCliente.addEventListener('change', async () => {
      const clienteId = selectCliente.value;
      selectVeiculo.innerHTML = '<option value="">Carregando veículos...</option>';
      selectVeiculo.disabled = true;

      if (!clienteId) {
        selectVeiculo.innerHTML = '<option value="">Selecione o cliente primeiro...</option>';
        return;
      }

      const { data, error } = await supabase
        .from('veiculos')
        .select('id, marca, modelo, placa')
        .eq('cliente_id', clienteId)
        .order('marca');

      if (error) {
        logSupabaseError('carregarVeiculosPorCliente', error);
        selectVeiculo.innerHTML = '<option value="">Erro ao carregar veículos</option>';
        return;
      }

      if (!data.length) {
        selectVeiculo.innerHTML = '<option value="">Nenhum veículo cadastrado para este cliente</option>';
        return;
      }

      veiculosCache = data;
      selectVeiculo.disabled = false;
      selectVeiculo.innerHTML = '<option value="">Selecione um veículo...</option>' +
        data.map(v => `<option value="${v.id}">${v.marca} ${v.modelo} - ${v.placa}</option>`).join('');
    });

    // -----------------------------------------------------------------
    // Ao trocar serviço -> exibe o preço automaticamente
    // -----------------------------------------------------------------
    selectServico.addEventListener('change', () => {
      const opcao = selectServico.selectedOptions[0];
      const preco = opcao?.dataset?.preco;
      precoServicoEl.textContent = preco ? formatarMoeda(preco) : '';
    });

    // -----------------------------------------------------------------
    // Envio do formulário de agendamento
    // -----------------------------------------------------------------
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSalvar.disabled = true;
      btnSalvar.textContent = 'Salvando...';
      msgEl.classList.add('hidden');

      const payload = {
        cliente_id: Number(selectCliente.value),
        veiculo_id: Number(selectVeiculo.value),
        servico_id: Number(selectServico.value),
        data_hora: new Date(document.getElementById('input-data-hora').value).toISOString(),
        observacoes: document.getElementById('input-observacoes').value || null,
        status: 'Pendente',
      };

      const { error } = await supabase.from('agendamentos').insert(payload);

      btnSalvar.disabled = false;
      btnSalvar.textContent = 'Agendar';

      if (error) {
        logSupabaseError('inserirAgendamento', error);
        msgEl.textContent = 'Erro ao salvar agendamento. Tente novamente.';
        msgEl.className = 'text-sm mt-3 text-red-600';
      } else {
        msgEl.textContent = 'Agendamento criado com sucesso!';
        msgEl.className = 'text-sm mt-3 text-green-600';
        form.reset();
        selectVeiculo.innerHTML = '<option value="">Selecione o cliente primeiro...</option>';
        selectVeiculo.disabled = true;
        precoServicoEl.textContent = '';
        await carregarAgendamentos();
      }
    });

    // -----------------------------------------------------------------
    // Carrega e renderiza a lista de agendamentos (com joins)
    // -----------------------------------------------------------------
    async function carregarAgendamentos() {
      listaEl.innerHTML = '<p class="text-gray-400 text-sm">Carregando agendamentos...</p>';

      const { data, error } = await supabase
        .from('agendamentos')
        .select(`
          id, data_hora, status, observacoes,
          clientes ( nome ),
          veiculos ( marca, modelo, placa ),
          servicos ( descricao, preco )
        `)
        .order('data_hora', { ascending: true });

      if (error) {
        logSupabaseError('carregarAgendamentos', error);
        listaEl.innerHTML = '<p class="text-red-500 text-sm">Erro ao carregar agendamentos.</p>';
        return;
      }

      if (!data.length) {
        listaEl.innerHTML = '<p class="text-gray-400 text-sm">Nenhum agendamento cadastrado ainda.</p>';
        return;
      }

      listaEl.innerHTML = data.map(renderAgendamento).join('');

      // Liga os listeners dos selects de status após renderizar
      document.querySelectorAll('.select-status').forEach(sel => {
        sel.addEventListener('change', async (e) => {
          const id = e.target.dataset.id;
          const novoStatus = e.target.value;
          e.target.disabled = true;
          const { error } = await supabase.from('agendamentos').update({ status: novoStatus }).eq('id', id);
          e.target.disabled = false;
          if (error) {
            logSupabaseError('atualizarStatus', error);
            alert('Erro ao atualizar status.');
          } else {
            await carregarAgendamentos();
          }
        });
      });
    }

    function renderAgendamento(ag) {
      const badge = STATUS_STYLE[ag.status] || STATUS_STYLE['Pendente'];
      const opcoesStatus = STATUS_OPCOES.map(s =>
        `<option value="${s}" ${s === ag.status ? 'selected' : ''}>${s}</option>`
      ).join('');

      return `
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <div class="space-y-1">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-semibold text-zinc-800">${ag.clientes?.nome ?? 'Cliente removido'}</span>
              <span class="text-xs px-2 py-0.5 rounded-full border font-medium ${badge}">${ag.status}</span>
            </div>
            <p class="text-sm text-gray-500">
              🚗 ${ag.veiculos ? `${ag.veiculos.marca} ${ag.veiculos.modelo} - ${ag.veiculos.placa}` : 'Veículo removido'}
            </p>
            <p class="text-sm text-gray-500">
              🛠️ ${ag.servicos?.descricao ?? 'Serviço removido'} • ${formatarMoeda(ag.servicos?.preco)}
            </p>
            <p class="text-sm text-gray-500">🗓️ ${formatarDataHora(ag.data_hora)}</p>
            ${ag.observacoes ? `<p class="text-sm text-gray-400 italic">"${escapeHtml(ag.observacoes)}"</p>` : ''}
          </div>
          <div class="shrink-0">
            <label class="block text-xs text-gray-400 mb-1">Atualizar status</label>
            <select data-id="${ag.id}" class="select-status border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
              ${opcoesStatus}
            </select>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    document.getElementById('btn-atualizar-lista').addEventListener('click', carregarAgendamentos);

    // -----------------------------------------------------------------
    // Inicialização da página
    // -----------------------------------------------------------------
    (async function init() {
      await Promise.all([carregarClientes(), carregarServicos()]);
      await carregarAgendamentos();
    })();
  </script>

</body>
</html>
